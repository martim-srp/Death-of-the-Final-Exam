# Colours taken from assets/cover.webp: near-black background, stamp red, parchment text.
[theme]
base = "dark"
primaryColor = "#c0392b"
backgroundColor = "#14100e"
secondaryBackgroundColor = "#241c18"
textColor = "#efe6d8"
headingFont = "serif"  # a noir, typewriter-era feel for titles

# Players see a generic message for an unexpected error, never its type, message, or
# traceback, so nothing from the server (paths, values, settings) can show up on screen.
# The full error still goes to the server log.
[client]
showErrorDetails = "none"
