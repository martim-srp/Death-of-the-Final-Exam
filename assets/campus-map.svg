<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Map of the Carcavelos campus at night">
<title>The Carcavelos campus at night</title>
<defs>
<radialGradient id="glow" cx="0.85" cy="0" r="1"><stop offset="0" stop-color="#3b2f24"/><stop offset="0.6" stop-color="#1b1512"/><stop offset="1" stop-color="#110d0b"/></radialGradient>
<pattern id="grass" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.7" fill="#3c4a33"/><circle cx="6" cy="6" r="0.7" fill="#3c4a33"/></pattern>
</defs>
<rect width="400" height="300" fill="url(#glow)"/>
<rect width="400" height="300" fill="url(#grass)" opacity="0.5"/>

<!-- The Atlantic, the beach and the coast road -->
<path d="M352 0 L400 0 L400 300 L300 300 C318 250 330 210 336 160 C342 100 344 50 352 0 Z" fill="#0f1c26"/>
<g stroke="#2c4658" stroke-width="1" fill="none" opacity="0.8">
<path d="M362 30 q6 -4 12 0 t12 0"/><path d="M358 90 q6 -4 12 0 t12 0"/><path d="M366 150 q6 -4 12 0 t12 0"/><path d="M352 210 q6 -4 12 0 t12 0"/><path d="M340 266 q6 -4 12 0 t12 0"/>
</g>
<text x="383" y="150" transform="rotate(90 383 150)" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="4" fill="#4d6b80">ATLANTIC</text>
<path d="M330 0 L352 0 C344 50 342 100 336 160 C330 210 318 250 300 300 L274 300 C294 250 306 210 312 160 C318 100 320 50 330 0 Z" fill="#3a3024"/>
<path d="M300 0 L318 0 C310 50 308 100 302 160 C296 210 284 250 266 300 L248 300 C266 250 278 210 284 160 C290 100 292 50 300 0 Z" fill="#2a2420"/>
<path d="M309 0 C301 50 299 100 293 160 C287 210 275 250 257 300" stroke="#efe6d8" stroke-width="1" stroke-dasharray="5 6" fill="none" opacity="0.35"/>

<!-- The main building: four wings around a courtyard -->
<rect x="105" y="45" width="170" height="185" fill="#1d2219" stroke="#b8924f" stroke-width="0.8" stroke-dasharray="2 3"/>
<g fill="#2f3b28"><circle cx="160" cy="120" r="6"/><circle cx="200" cy="150" r="7"/><circle cx="175" cy="170" r="5"/><circle cx="215" cy="110" r="5"/></g>
<g fill="#2a221d" stroke="#b8924f" stroke-width="1.5">
<rect x="105" y="45" width="170" height="38"/>
<rect x="105" y="83" width="38" height="110"/>
<rect x="237" y="83" width="38" height="110"/>
<rect x="105" y="193" width="170" height="37"/>
</g>
<g stroke="#b8924f" stroke-width="0.6" opacity="0.5"><path d="M135 45 V83 M165 45 V83 M195 45 V83 M225 45 V83 M255 45 V83"/><path d="M105 110 H143 M105 138 H143 M105 166 H143"/></g>
<g font-family="Georgia, serif" fill="#efe6d8" text-anchor="middle" letter-spacing="2">
<text x="190" y="68" font-size="9">LIBRARY</text>
<text x="124" y="140" font-size="8" transform="rotate(-90 124 140)">FACULTY</text>
<text x="256" y="140" font-size="8" transform="rotate(90 256 140)">AUDITORIA</text>
<text x="190" y="216" font-size="9">CAFETERIA</text>
<text x="190" y="140" font-size="7" fill="#8a9a78" letter-spacing="1">courtyard</text>
</g>

<!-- The residence and the beach café -->
<g transform="rotate(-8 75 258)"><rect x="30" y="238" width="90" height="40" fill="#2a221d" stroke="#b8924f" stroke-width="1.5"/>
<g fill="#b8924f" opacity="0.7"><rect x="38" y="246" width="6" height="5"/><rect x="52" y="246" width="6" height="5"/><rect x="66" y="246" width="6" height="5"/><rect x="94" y="246" width="6" height="5"/><rect x="108" y="262" width="6" height="5"/><rect x="80" y="262" width="6" height="5"/></g></g>
<text x="75" y="232" font-family="Georgia, serif" font-size="8" letter-spacing="2" fill="#efe6d8" text-anchor="middle">RESIDENCE</text>
<path d="M140 230 C120 250 110 262 100 262" stroke="#4a3e33" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
<rect x="312" y="236" width="26" height="16" fill="#2a221d" stroke="#b8924f" stroke-width="1.5"/><path d="M308 236 L325 226 L342 236 Z" fill="#7d1d1a" stroke="#b8924f"/>
<text x="326" y="266" font-family="Georgia, serif" font-size="8" letter-spacing="1.5" fill="#efe6d8" text-anchor="middle">BEACH CAFÉ</text>
<path d="M275 212 C290 220 300 230 312 242" stroke="#4a3e33" stroke-width="2" stroke-dasharray="3 3" fill="none"/>

<!-- Compass and title -->
<g transform="translate(36 40)" fill="none" stroke="#b8924f" stroke-width="1"><circle r="14"/><path d="M0 -18 L4 0 L0 18 L-4 0 Z" fill="#b8924f" opacity="0.6"/></g>
