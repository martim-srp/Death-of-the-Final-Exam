<text x="14" y="76" font-family="Georgia, serif" font-size="8" letter-spacing="1.5" fill="#b8924f">CARCAVELOS</text>
<text x="14" y="87" font-family="Georgia, serif" font-size="6.5" letter-spacing="1" fill="#8a7a66">CAMPUS · 23:47</text>
<rect x="2" y="2" width="396" height="296" fill="none" stroke="#b8924f" stroke-width="2" opacity="0.8"/>
