name: Tests

# Runs the whole test suite on every pull request and on every push to main,
# so a green check shows that all tests pass before and after a merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Tests never call the real AI, so no REQUESTY_API_KEY is needed here.
      - run: python -m pytest -q

  audit:
    # Fails if any pinned dependency has a known vulnerability (Security criterion).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
